name: Build Fabric mod
on:
  workflow_dispatch:
  push:
    paths: ['src/**', '*.gradle', 'gradle.properties', 'tools/build.py', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-minecraft-26.3
          path: build/libs/dynamic-island-0.4.0.jar
          if-no-files-found: error
